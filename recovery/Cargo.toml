[package]
name = "recovery"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.15.1", default-features = false, features = ["renderer-software", "compat-1-2", "std"]}
toml = "0"
serde = { version = "1.0", features = ["derive"] }

[features]
pc = ["slint/accessibility", "slint/backend-default", "slint/renderer-femtovg"]

[target.'cfg(unix)'.dependencies]
driver = { path = "../driver" }

[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.8.0", default-features = false, features = ["fontconfig-dlopen"] }

[workspace.metadata.cross.target.armv7-unknown-linux-musleabihf]
pre-build = [
    "apt-get update",
    "apt-get install -y libfontconfig1-dev libssl-dev openssl pkg-config",
]

[build-dependencies]
slint-build = { version = "1.15.1", package = "slint-build" }

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1